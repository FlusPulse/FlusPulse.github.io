<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="robots" content="noindex, nofollow">
  <title>Платёж обрабатывается · FlusPulse</title>
  <meta name="description" content="Возврат после оплаты Flux в FlusPulse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7f5;
      --ink: #142624;
      --muted: #687a76;
      --line: #dce6e1;
      --mint: #b9f2df;
      --cyan: #37c9dc;
      --amber: #e4a84b;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 4%, rgba(55, 201, 220, .14), transparent 28rem),
        radial-gradient(ellipse at 92% 88%, rgba(185, 242, 223, .72), transparent 32rem),
        var(--paper);
      font-family: "DM Sans", sans-serif;
      line-height: 1.55;
    }

    .topbar, footer {
      width: min(100% - 40px, 1080px);
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-block: 24px;
      font-family: "Manrope", sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      object-fit: cover;
      border-radius: 12px;
    }

    main {
      display: grid;
      place-items: center;
      padding: 32px 20px 72px;
    }

    .content {
      width: min(100%, 680px);
      text-align: center;
      animation: arrive .55s ease-out both;
    }

    .status-art {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border: 1px solid rgba(20, 38, 36, .08);
      border-radius: 34px;
      background: linear-gradient(145deg, #fff, #e8f8f2);
      box-shadow: 0 22px 60px rgba(33, 72, 62, .11);
    }

    .status-art span {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 2px solid var(--amber);
      border-radius: 50%;
      color: #9b6820;
      font-family: "Manrope", sans-serif;
      font-size: 27px;
      font-weight: 600;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #34776c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0 auto;
      font-family: "Manrope", sans-serif;
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 800;
      line-height: 1.08;
    }

    .lead {
      max-width: 520px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 17px;
    }

    .steps {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      margin: 42px auto 0;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .66);
      text-align: left;
    }

    .step { display: flex; align-items: center; gap: 11px; }

    .step-index {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--mint);
      color: #1d6557;
      font-size: 13px;
      font-weight: 700;
    }

    .step:last-child .step-index { background: #d8f4f6; color: #176c78; }
    .step-copy { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .connector { width: 30px; height: 1px; background: #b8cbc4; }

    footer {
      padding-block: 20px 26px;
      border-top: 1px solid rgba(20, 38, 36, .09);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .topbar, footer { width: min(100% - 32px, 1080px); }
      .topbar { padding-block: 18px; }
      main { padding: 20px 16px 48px; }
      .status-art { width: 92px; height: 92px; border-radius: 28px; margin-bottom: 23px; }
      .lead { font-size: 15px; }
      .steps { grid-template-columns: 1fr; gap: 14px; margin-top: 32px; padding: 17px; }
      .connector { width: 1px; height: 13px; margin-left: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <img class="brand-mark" src="logo.png" alt="">
    <span>FlusPulse</span>
  </header>

  <main>
    <section class="content" aria-labelledby="page-title" aria-live="polite">
      <div class="status-art" aria-hidden="true"><span>…</span></div>
      <p class="eyebrow">FlusPulse</p>
      <h1 id="page-title">Платежи временно недоступны</h1>
      <p class="lead">Для уточнения покупки и зачисления Flux напишите в <a href="https://t.me/FlusPulseSupportagent">Telegram-бот FlusPulseSupportagent</a>.</p>

      <div class="steps" aria-label="Что происходит дальше">
        <div class="step">
          <span class="step-index">1</span>
          <span class="step-copy">Свяжитесь с поддержкой в Telegram</span>
        </div>
        <span class="connector" aria-hidden="true"></span>
        <div class="step">
          <span class="step-index">2</span>
          <span class="step-copy">Поддержка объяснит порядок покупки Flux</span>
        </div>
      </div>
    </section>
  </main>

  <footer>Не оплачивайте покупку, пока поддержка не подтвердит её условия.</footer>
</body>
</html>
